version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lenny_postgres
    restart: always
    environment:
      POSTGRES_DB: lenny_growth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenny_growth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
